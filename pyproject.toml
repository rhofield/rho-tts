[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rho-tts"
version = "1.3.1"
description = "Multi-provider text-to-speech library with voice cloning, accent drift detection, and STT validation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ryan" },
]
keywords = ["tts", "text-to-speech", "voice-cloning", "speech-synthesis", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "numpy",
    "pydub",
    "num2words",
    "nemo_text_processing",
    "text2num",
]

[project.optional-dependencies]
qwen = [
    "qwen-tts",
    "transformers>=4.40",
]
chatterbox = [
    "chatterbox-tts",
    "setuptools<82",
]
# Breeze pins its dependencies exactly and is always run in an isolated venv.
# The upstream package itself is NOT installable from PyPI — it has no
# packaging metadata — so VenvManager clones it separately (see venv_manager).
# torchcodec is not declared upstream but is required: torchaudio >= 2.9
# delegates all I/O to it, and isolation/worker.py calls torchaudio.save.
breeze = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchcodec",
    "transformers==4.57.3",
    "qwen-tts==0.1.1",
    "numpy>=2.0",
    "soundfile>=0.13",
    "huggingface_hub",
]
# Isolated providers install this extra alongside their synthesis dependencies.
validation = [
    "soundfile>=0.13",
    "faster-whisper>=1.0",
    "resemblyzer>=0.1.3",
    "scikit-learn>=1.3",
    "joblib",
    "librosa>=0.10",
    "setuptools<82",
]
ui = [
    "gradio>=4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
# NOTE: "breeze" is deliberately excluded from [all] — its pins conflict with
# the other providers, and its model weights are non-commercial licensed.
all = [
    "rho-tts[qwen,chatterbox,validation,dev,ui]",
]

[project.scripts]
rho-tts-ui = "rho_tts.ui:launch_ui"

[project.urls]
Homepage = "https://github.com/rhofield/rho-tts"
Repository = "https://github.com/rhofield/rho-tts"
Issues = "https://github.com/rhofield/rho-tts/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rho_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
